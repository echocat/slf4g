name: Release

on:
  release:
    types:
      - published

permissions:
  actions: read
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Validate release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE" == "true" ]]; then
            echo "::error::Prereleases are not supported."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|1)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid canonical v0/v1 release tag: $TAG"
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .immutable)" != "true" ]]; then
            echo "::error::Release ${TAG} is not immutable."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release commit
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          ROOT_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$ROOT_COMMIT" refs/remotes/origin/main; then
            echo "::error::Release tag ${TAG} is not based on main."
            exit 1
          fi
          echo "commit=${ROOT_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Require successful main checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 600))
          require_successful_ci_run() {
            local kind
            local jobs_ok
            local runs_url
            local run_id
            local snapshot
            local state
            local value
            runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${ROOT_COMMIT}&per_page=100"

            while true; do
              if ! snapshot="$(gh api "$runs_url" --jq '
                (["state", (
                  if any(.workflow_runs[]; .status != "completed") then "pending"
                  elif (.workflow_runs | length) > 0 then "failed"
                  else "pending"
                  end
                )] | @tsv),
                (.workflow_runs[] | select(.conclusion == "success") | ["run", (.id | tostring)] | @tsv)
              ')"; then
                echo "::error::Could not query Continuous Integration runs for ${ROOT_COMMIT}."
                exit 1
              fi

              state=""
              while IFS=$'\t' read -r kind value; do
                case "$kind" in
                  state)
                    state="$value"
                    ;;
                  run)
                    run_id="$value"
                    if ! jobs_ok="$(gh api \
                      "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                      --jq '
                    any(.jobs[]; .name == "Quality gate" and .conclusion == "success") and
                    any(.jobs[]; .name == "Finish" and .conclusion == "success")
                      ')"; then
                      echo "::error::Could not query jobs for Continuous Integration run ${run_id}."
                      exit 1
                    fi
                    if [[ "$jobs_ok" == "true" ]]; then
                      echo "Continuous Integration passed the full quality gate for ${ROOT_COMMIT}."
                      return
                    fi
                    ;;
                  *)
                    echo "::error::Unexpected Continuous Integration snapshot entry: ${kind}"
                    exit 1
                    ;;
                esac
              done <<< "$snapshot"

              case "$state" in
                failed)
                  echo "::error::Continuous Integration did not pass the full quality gate for ${ROOT_COMMIT}."
                  exit 1
                  ;;
                pending)
                  if (( SECONDS >= deadline )); then
                    echo "::error::Timed out waiting for Continuous Integration on ${ROOT_COMMIT}."
                    exit 1
                  fi
                  sleep 10
                  ;;
                *)
                  echo "::error::Unexpected Continuous Integration state: ${state}"
                  exit 1
                  ;;
              esac
            done
          }

          require_successful_run() {
            local workflow="$1"
            local label="$2"
            local state

            while true; do
              state="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=push&head_sha=${ROOT_COMMIT}&per_page=100" \
                --jq '
                  if any(.workflow_runs[]; .conclusion == "success") then "success"
                  elif any(.workflow_runs[]; .status != "completed") then "pending"
                  elif (.workflow_runs | length) > 0 then "failed"
                  else "pending"
                  end
                ')"
              case "$state" in
                success)
                  echo "${label} passed for ${ROOT_COMMIT}."
                  return
                  ;;
                failed)
                  echo "::error::${label} did not pass for ${ROOT_COMMIT}."
                  exit 1
                  ;;
                pending)
                  if (( SECONDS >= deadline )); then
                    echo "::error::Timed out waiting for ${label} on ${ROOT_COMMIT}."
                    exit 1
                  fi
                  sleep 10
                  ;;
                *)
                  echo "::error::Unexpected ${label} state: ${state}"
                  exit 1
                  ;;
              esac
            done
          }

          require_successful_ci_run
          require_successful_run codeql-analysis.yml "CodeQL"

  prepare-native-release:
    needs: validate-release
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.native-release-files.outputs.artifact-id }}

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.6
          install: true
          install_args: --locked

      - name: Prepare native release files
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mise -E ci-go123 exec -- go -C native mod edit \
            -dropreplace=github.com/echocat/slf4g \
            -require="github.com/echocat/slf4g@${TAG}"

          GOWORK=off \
          GOTOOLCHAIN=local \
          GOPROXY=direct \
          GONOSUMDB=github.com/echocat/slf4g \
            mise -E ci-go123 exec -- go -C native mod tidy

          GOWORK=off \
          GOTOOLCHAIN=local \
          GOFLAGS=-mod=readonly \
          GOPROXY=direct \
          GONOSUMDB=github.com/echocat/slf4g \
            mise -E ci-go123 exec -- go -C native mod verify

      - name: Validate native release files
        shell: bash
        run: |
          set -euo pipefail

          for file in native/go.mod native/go.sum; do
            if [[ ! -f "$file" || -L "$file" ]]; then
              echo "::error::Native release file is not a regular file: $file"
              exit 1
            fi
          done

          git add -- native/go.mod native/go.sum
          while IFS= read -r file; do
            case "$file" in
              native/go.mod|native/go.sum) ;;
              *)
                echo "::error::Unexpected native release file: $file"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

      - name: Store native release files
        id: native-release-files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-release-files
          path: |
            native/go.mod
            native/go.sum
          retention-days: 1
          if-no-files-found: error

      - name: Test native release files
        shell: bash
        run: |
          set -euo pipefail

          GOWORK=off \
          GOTOOLCHAIN=local \
          GOFLAGS=-mod=readonly \
          GOPROXY=direct \
          GONOSUMDB=github.com/echocat/slf4g \
            mise -E ci-go123 exec -- go -C native test -race ./...

  create-native-tag:
    needs:
      - validate-release
      - prepare-native-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.commit }}
          fetch-depth: 0

      - name: Validate native release artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.prepare-native-release.outputs.artifact-id }}
        run: |
          set -euo pipefail

          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid native release artifact ID."
            exit 1
          fi

      - name: Download native release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.prepare-native-release.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-release-files

      - name: Install native release files
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/native-release-files
        run: |
          set -euo pipefail

          for file in go.mod go.sum; do
            source="${ARTIFACT_DIR}/${file}"
            target="native/${file}"
            if [[ ! -f "$source" || -L "$source" ]]; then
              echo "::error::Downloaded native release file is not a regular file: $file"
              exit 1
            fi
            if [[ ! -f "$target" || -L "$target" ]]; then
              echo "::error::Native release target is not a regular file: $target"
              exit 1
            fi
            install -m 0644 -- "$source" "$target"
          done

          mkdir -p "$RUNNER_TEMP/empty-git-hooks"
          git config --global core.hooksPath "$RUNNER_TEMP/empty-git-hooks"

      - name: Create native release tag
        shell: bash
        env:
          ROOT_COMMIT: ${{ needs.validate-release.outputs.commit }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          NATIVE_TAG="native/${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native/go.mod native/go.sum

          while IFS= read -r file; do
            case "$file" in
              native/go.mod|native/go.sum) ;;
              *)
                echo "::error::Unexpected native release file: $file"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          git commit -m "Prepare ${NATIVE_TAG}"
          CANDIDATE_COMMIT="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(git rev-parse "${CANDIDATE_COMMIT}^{tree}")"

          validate_existing_tag() {
            git fetch --force origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
            local existing_commit existing_parent existing_tree
            existing_commit="$(git rev-parse --verify "refs/tags/${NATIVE_TAG}^{commit}")"
            existing_parent="$(git rev-parse --verify "${existing_commit}^")"
            existing_tree="$(git rev-parse --verify "${existing_commit}^{tree}")"
            if [[ "$existing_parent" != "$ROOT_COMMIT" || "$existing_tree" != "$CANDIDATE_TREE" ]]; then
              echo "::error::${NATIVE_TAG} does not match the generated release commit."
              exit 1
            fi
            echo "${NATIVE_TAG} already contains the expected native release."
          }

          if git ls-remote --exit-code --refs origin "refs/tags/${NATIVE_TAG}" >/dev/null; then
            validate_existing_tag
            exit 0
          fi

          git tag "$NATIVE_TAG" "$CANDIDATE_COMMIT"
          if git push origin "refs/tags/${NATIVE_TAG}"; then
            exit 0
          fi

          # A concurrent run may have created the same release tag.
          validate_existing_tag
