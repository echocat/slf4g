name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  create-native-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (mit Tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag format
        id: validate
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag_ok=true" >> "$GITHUB_OUTPUT"
            echo "${TAG} is valid."
          else
            echo "${TAG} does not comply with required format ^v[0-9]+\\.[0-9]+\\.[0-9]+$; Skipping."
            echo "tag_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sub tags
        if: steps.validate.outputs.tag_ok == 'true'
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          NATIVE_TAG="native/${TAG}"

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"

          if git ls-remote --exit-code --refs origin "refs/tags/${NATIVE_TAG}" >/dev/null; then
            git fetch --force origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
            EXISTING_COMMIT="$(git rev-parse --verify "refs/tags/${NATIVE_TAG}^{commit}")"
            if [[ "$EXISTING_COMMIT" == "$COMMIT" ]]; then
              echo "$NATIVE_TAG already points to $COMMIT; nothing to do."
              exit 0
            fi
            echo "::error::$NATIVE_TAG already points to $EXISTING_COMMIT instead of $COMMIT."
            exit 1
          fi

          echo "Set $NATIVE_TAG to $COMMIT..."

          # Create tag(s)...
          git tag "$NATIVE_TAG" "$COMMIT"

          # Push tags(s)...
          if git push origin "refs/tags/$NATIVE_TAG"; then
            exit 0
          fi

          # A concurrent workflow might have created the same immutable tag.
          git fetch --force origin "refs/tags/${NATIVE_TAG}:refs/tags/${NATIVE_TAG}"
          EXISTING_COMMIT="$(git rev-parse --verify "refs/tags/${NATIVE_TAG}^{commit}")"
          if [[ "$EXISTING_COMMIT" == "$COMMIT" ]]; then
            echo "$NATIVE_TAG was concurrently created at $COMMIT; nothing to do."
            exit 0
          fi
          echo "::error::$NATIVE_TAG was concurrently created at $EXISTING_COMMIT instead of $COMMIT."
          exit 1
