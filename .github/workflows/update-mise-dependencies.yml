name: Update mise dependencies

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mise-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.6
          install: false
          cache: false

      - name: Update tool lockfiles
        id: update
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise run tools:update

          if git diff --quiet -- 'mise*.lock'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updates
        if: steps.update.outputs.changed == 'true'
        run: mise run check:full

      - name: Verify environment lockfiles
        if: steps.update.outputs.changed == 'true'
        run: |
          mise -E ci-go118 install --locked
          mise -E ci-go122 install --locked
          mise -E ci-go123 install --locked
          mise -E ci-lint install --locked
          mise -E ci-stable install --locked

      - name: Check diff
        if: steps.update.outputs.changed == 'true'
        run: git diff --check

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/mise-dependencies
          delete-branch: true
          draft: always-true
          commit-message: Update mise dependencies
          title: Update mise dependencies
          body: |
            Updates mise tool lockfiles to releases that are at least seven days old.

            The full Mise quality gate passed before this pull request was created.
            Mark the pull request ready for review to run the full CI matrix.
          add-paths: |
            mise*.lock
