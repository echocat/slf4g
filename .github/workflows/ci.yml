name: Continuous Integration

on:
  release:
    types:
      - published
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    env:
      MISE_ENV: ci-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        module: [ root, native, eventlog ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
          install: true
          install_args: --locked

      - name: Cache Go and golangci-lint
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
            ~/.cache/golangci-lint
            ~/Library/Caches/golangci-lint
            ~/AppData/Local/golangci-lint
          key: lint-${{ runner.os }}-${{ runner.arch }}-${{ matrix.module }}-${{ hashFiles('mise*.lock', '**/go.sum') }}

      - name: Lint
        run: mise run lint:${{ matrix.module }}

  test:
    name: Test .
    strategy:
      fail-fast: false
      matrix:
        go:
          - version: '1.18'
            task: ci:test:root:go118
            mise-env: ci-go118
          - version: '1.22'
            task: ci:test:root:go122
            mise-env: ci-go122
          - version: '1.23'
            task: ci:test:root:go123
            mise-env: ci-go123
          - version: stable
            task: ci:test:root:stable
            mise-env: ci-stable
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENV: ${{ matrix.go.mise-env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
          install: true
          install_args: --locked

      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: test-root-${{ runner.os }}-${{ runner.arch }}-${{ matrix.go.version }}-${{ hashFiles('mise*.lock', 'go.mod', 'go.sum') }}

      - name: Test
        run: mise run ${{ matrix.go.task }}

      - name: Filter coverage
        shell: bash
        run: |
          head -n1 profile.cov.full > profile.cov
          tail -n +2 profile.cov.full | grep -vE '^github\.com\/echocat\/slf4g\/(internal\/(test|demo|support)\/|hooks\/|sdk\/bridge\/hook\/)' >> profile.cov

      - name: Store test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-go-${{ matrix.go.version }}-${{ matrix.os }}-${{ github.run_number }}
          path: |
            profile.cov
          retention-days: 1
          if-no-files-found: warn

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: go-${{ matrix.go.version }}-${{ matrix.os }}-slf4g
          format: golang
          file: profile.cov

  test-native:
    name: Test native
    strategy:
      fail-fast: false
      matrix:
        go:
          - version: '1.23'
            task: ci:test:native:go123
            mise-env: ci-go123
          - version: stable
            task: ci:test:native:stable
            mise-env: ci-stable
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENV: ${{ matrix.go.mise-env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
          install: true
          install_args: --locked

      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: test-native-${{ runner.os }}-${{ runner.arch }}-${{ matrix.go.version }}-${{ hashFiles('mise*.lock', 'native/go.mod', 'native/go.sum') }}

      - name: Test
        run: mise run ${{ matrix.go.task }}

      - name: Filter coverage
        shell: bash
        run: |
          cd native
          head -n1 profile.cov.full > profile.cov
          tail -n +2 profile.cov.full | grep -vE '^github\.com\/echocat\/slf4g\/native\/(internal\/demo_|color\/prepare_)' >> profile.cov

      - name: Store test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-native-go-${{ matrix.go.version }}-${{ matrix.os }}-${{ github.run_number }}
          path: |
            native/profile.cov
          retention-days: 1
          if-no-files-found: warn

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: go-${{ matrix.go.version }}-${{ matrix.os }}-slf4g-native
          format: golang
          file: native/profile.cov

  test-eventlog:
    name: Test eventlog
    strategy:
      fail-fast: false
      matrix:
        go:
          - version: '1.23'
            task: ci:test:eventlog:go123
            mise-env: ci-go123
          - version: stable
            task: ci:test:eventlog:stable
            mise-env: ci-stable
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
      MISE_ENV: ${{ matrix.go.mise-env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
          install: true
          install_args: --locked

      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: test-eventlog-${{ runner.os }}-${{ runner.arch }}-${{ matrix.go.version }}-${{ hashFiles('mise*.lock', 'platform/windows/eventlog/go.mod', 'platform/windows/eventlog/go.sum') }}

      - name: Test
        run: mise run ${{ matrix.go.task }}

  finish:
    name: Finish
    needs:
      - test
      - test-native
      - test-eventlog
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send coverage finish
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
