name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        version: 2026.8.6
        install: true
        install_args: --locked

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
      with:
        languages: ${{ matrix.language }}

    - name: Build
      run: mise run build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
