name: "CodeQL"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 18 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install mise
      uses: jdx/mise-action@v4
      with:
        version: 2026.8.6
        install: true
        install_args: --locked

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Build
      run: mise run build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
